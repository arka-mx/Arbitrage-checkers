[project]
name = "options-edge"
version = "0.1.0"
description = "US index options pipeline: does the theoretical edge survive costs?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "alpaca-py>=0.33",
    "python-dotenv>=1.0",
    "scipy>=1.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["options_edge*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
